      <div class="tip"><strong>🚫 Evite ultraprocessados:</strong> Refrigerantes, salgadinhos e fast-food são ricos em calorias vazias.</div>

      <div class="tip"><strong>🍳 Não pule o café da manhã:</strong> Uma boa refeição matinal ajuda a controlar a fome ao longo do dia.</div>

<script>
let dados = JSON.parse(localStorage.getItem('fittrack')) || { pesos: [], refeicoes: [], exercicios: [], meta: null, metaCalorias: 2000 };
function salvar() { localStorage.setItem('fittrack', JSON.stringify(dados)); }
function hoje() { return new Date().toISOString().split('T')[0]; }
function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id === 'dashboard') atualizarDashboard();
  if (id === 'deficit') atualizarDeficit();
  if (id === 'peso') renderPesos();
  if (id === 'alimentacao') renderRefeicoes();
  if (id === 'exercicios') renderExercicios();
}
function calcIMC() {
  const peso = parseFloat(document.getElementById('imcPeso').value);
  const altura = parseFloat(document.getElementById('imcAltura').value) / 100;
  if (!peso || !altura) { alert('Preencha todos os campos'); return; }
  const imc = peso / (altura * altura);
  let classe = '', cor = '';
  if (imc < 18.5) { classe = 'Abaixo do peso'; cor = '#3b82f6'; }
  else if (imc < 25) { classe = 'Peso normal ✅'; cor = '#10b981'; }
  else if (imc < 30) { classe = 'Sobrepeso'; cor = '#f59e0b'; }
  else if (imc < 35) { classe = 'Obesidade grau I'; cor = '#f97316'; }
  else if (imc < 40) { classe = 'Obesidade grau II'; cor = '#ef4444'; }
  else { classe = 'Obesidade grau III'; cor = '#991b1b'; }
  document.getElementById('imcResult').innerHTML = '<div class="result"><h3>Seu IMC</h3><div class="big" style="color:'+cor+'">'+imc.toFixed(1)+'</div><div class="info"><strong>'+classe+'</strong></div></div>';
}
function calcTMB() {
  const sexo = document.getElementById('tmbSexo').value;
  const idade = parseFloat(document.getElementById('tmbIdade').value);
  const peso = parseFloat(document.getElementById('tmbPeso').value);
  const altura = parseFloat(document.getElementById('tmbAltura').value);
  const ativ = parseFloat(document.getElementById('tmbAtividade').value);
  if (!idade || !peso || !altura) { alert('Preencha todos os campos'); return; }
  let tmb = sexo === 'M' ? 88.362 + (13.397 * peso) + (4.799 * altura) - (5.677 * idade) : 447.593 + (9.247 * peso) + (3.098 * altura) - (4.330 * idade);
  const gasto = tmb * ativ;
  const emagrecer = gasto - 500;
  document.getElementById('tmbResult').innerHTML = '<div class="result"><h3>Resultados</h3><div class="info">TMB: <strong>'+Math.round(tmb)+' kcal/dia</strong></div><div class="info">Gasto total: <strong>'+Math.round(gasto)+' kcal/dia</strong></div><div class="info">Para emagrecer 0,5kg/sem: <strong style="color:#10b981">'+Math.round(emagrecer)+' kcal/dia</strong></div></div>';
}
function salvarMetaCalorias() {
  const meta = parseFloat(document.getElementById('metaCalorias').value);
  if (!meta || meta < 1000) { alert('Informe uma meta válida (mínimo 1000 kcal)'); return; }
  dados.metaCalorias = meta;
  salvar();
  atualizarDeficit();
  alert('Meta de calorias atualizada!');
}
function calcularDeficitDia(data) {
  const refs = dados.refeicoes.filter(r => r.data === data);
  const exercs = dados.exercicios.filter(e => e.data === data);
  const consumidas = refs.reduce((s, r) => s + r.cal, 0);
  const gastas = exercs.reduce((s, e) => s + e.cal, 0);
  const liquido = consumidas - gastas;
  const deficit = dados.metaCalorias - liquido;
  return { consumidas, gastas, liquido, deficit };
}
function atualizarDeficit() {
  const hojeStr = hoje();
  const defHoje = calcularDeficitDia(hojeStr);
  document.getElementById('defConsumidas').textContent = defHoje.consumidas;
  document.getElementById('defMeta').textContent = dados.metaCalorias;
  document.getElementById('defAtual').textContent = defHoje.deficit;
  document.getElementById('metaCalorias').value = dados.metaCalorias;
  let statusHTML = '';
  if (defHoje.deficit > 0) {
    statusHTML = '<div class="deficit-card"><h3>✅ Ótimo! Você está em déficit</h3><p style="font-size:0.9rem; color:#92400e;">Déficit de <strong class="deficit-positive">'+defHoje.deficit+' kcal</strong> hoje. '+ (defHoje.deficit >= 500 ? '🎯 Perfeito!' : 'Continue assim!') +'</p></div>';
  } else if (defHoje.deficit < 0) {
    statusHTML = '<div class="deficit-card"><h3>⚠️ Superávit calórico</h3><p style="font-size:0.9rem; color:#92400e;">Você consumiu <strong class="deficit-negative">'+Math.abs(defHoje.deficit)+' kcal</strong> acima da meta.</p></div>';
  } else {
    statusHTML = '<div class="deficit-card"><h3>⚖️ Equilíbrio perfeito</h3><p style="font-size:0.9rem; color:#92400e;">Você está exatamente na meta. Para emagrecer, crie um déficit!</p></div>';
  }
  document.getElementById('defStatus').innerHTML = statusHTML;
  const ultimos7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dataStr = d.toISOString().split('T')[0];
    const def = calcularDeficitDia(dataStr);
    ultimos7.push({ data: dataStr, deficit: def.deficit });
  }
  const defMedio7 = ultimos7.reduce((s, d) => s + d.deficit, 0) / 7;
  document.getElementById('defMedio7').textContent = Math.round(defMedio7);
  const todasDatas = new Set([...dados.refeicoes.map(r => r.data), ...dados.exercicios.map(e => e.data)]);
  let defTotal = 0;
  todasDatas.forEach(data => { defTotal += calcularDeficitDia(data).deficit; });
  document.getElementById('defTotal').textContent = Math.round(defTotal);
  const kgEstimados = defTotal / 7700;
  document.getElementById('kgPerdidoEst').textContent = kgEstimados.toFixed(2);
  let projHTML = '';
  if (defMedio7 > 0 && dados.meta) {
    const kgFaltam = dados.meta.atual - (dados.pesos.length > 0 ? dados.pesos[dados.pesos.length-1].valor : dados.meta.atual);
    if (kgFaltam > 0) {
      const diasNecessarios = Math.ceil((kgFaltam * 7700) / defMedio7);
      const dataProj = new Date();
      dataProj.setDate(dataProj.getDate() + diasNecessarios);
      projHTML = '<div class="deficit-card"><h3>🔮 Projeção</h3><p style="font-size:0.9rem; color:#92400e;">Com déficit médio de <strong>'+Math.round(defMedio7)+' kcal/dia</strong>, você perderá <strong>'+(defMedio7 * 7 / 7700).toFixed(2)+' kg/semana</strong>. Para perder <strong>'+kgFaltam.toFixed(1)+' kg</strong>, levará <strong>'+diasNecessarios+' dias</strong>. Previsão: <strong>'+dataProj.toLocaleDateString('pt-BR')+'</strong></p></div>';
    }
  }
  document.getElementById('defProjection').innerHTML = projHTML;
  desenharGraficoDeficit(ultimos7);
  const listHTML = ultimos7.slice().reverse().map(d => {
    const dataFmt = d.data.split('-').reverse().join('/');
    const cor = d.deficit > 0 ? 'var(--primary)' : 'var(--danger)';
    return '<div class="list-item"><div class="info"><div class="title">'+dataFmt+'</div></div><span class="badge" style="background:'+cor+'">'+(d.deficit > 0 ? '+' : '')+Math.round(d.deficit)+' kcal</span></div>';
  }).join('');
  document.getElementById('defList').innerHTML = listHTML;
}
function desenharGraficoDeficit(dados7dias) {
  const canvas = document.getElementById('chartDeficit');
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = 150;
  ctx.clearRect(0, 0, w, h);
  const valores = dados7dias.map(d => d.deficit);
  const maxAbs = Math.max(Math.abs(Math.min(...valores)), Math.abs(Math.max(...valores)), 100);
  const padding = 30;
  const wUtil = w - padding * 2;
  const hUtil = h - padding * 2;
  const meio = h / 2;
  ctx.strokeStyle = '#9ca3af';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(padding, meio);
  ctx.lineTo(w - padding, meio);
  ctx.stroke();
  ctx.setLineDash([]);
  const barWidth = wUtil / dados7dias.length * 0.6;
  dados7dias.forEach((d, i) => {
    const x = padding + (i + 0.5) * (wUtil / dados7dias.length) - barWidth / 2;
    const barHeight = (Math.abs(d.deficit) / maxAbs) * (hUtil / 2);
    const y = d.deficit >= 0 ? meio - barHeight : meio;
    ctx.fillStyle = d.deficit >= 0 ? '#10b981' : '#ef4444';
    ctx.fillRect(x, y, barWidth, barHeight);
  });
  ctx.fillStyle = '#6b7280';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  dados7dias.forEach((d, i) => {
    const x = padding + (i + 0.5) * (wUtil / dados7dias.length);
    const dataFmt = d.data.split('-').slice(2).join('/');
    ctx.fillText(dataFmt, x, h - 5);
  });
}
function addPeso() {
  const data = document.getElementById('pesoData').value || hoje();
  const valor = parseFloat(document.getElementById('pesoValor').value);
  if (!valor) { alert('Informe o peso'); return; }
  dados.pesos.push({ data, valor });
  dados.pesos.sort((a,b) => a.data.localeCompare(b.data));
  salvar();
  document.getElementById('pesoValor').value = '';
  renderPesos();
  atualizarDashboard();
}
function delPeso(i) {
  if (confirm('Remover este registro?')) {
    dados.pesos.splice(i, 1);

  }
}
function renderPesos() {
  const list = document.getElementById('pesoList');
  if (dados.pesos.length === 0) { list.innerHTML = '<div class="empty">Nenhum peso registrado ainda</div>'; return; }
  list.innerHTML = dados.pesos.slice().reverse().map((p, idx) => {
    const i = dados.pesos.length - 1 - idx;
    const dataFmt = p.data.split('-').reverse().join('/');
    return '<div class="list-item"><div class="info"><div class="title">'+p.valor+' kg</div><div class="sub">'+dataFmt+'</div></div><button class="btn btn-danger btn-small" onclick="delPeso('+i+')">🗑️</button></div>';
  }).join('');
}
function salvarMeta() {
  const atual = parseFloat(document.getElementById('metaPesoAtual').value);
  const desejado = parseFloat(document.getElementById('metaPesoDesejado').value);
  const ritmo = parseFloat(document.getElementById('metaRitmo').value);
  if (!atual || !desejado) { alert('Preencha os pesos'); return; }
  const kgPerder = atual - desejado;
  if (kgPerder <= 0) { alert('O peso desejado deve ser menor que o atual'); return; }
  const semanas = Math.ceil(kgPerder / ritmo);
  const dataFinal = new Date();
  dataFinal.setDate(dataFinal.getDate() + semanas * 7);
  dados.meta = { atual, desejado, ritmo, dataFinal: dataFinal.toISOString().split('T')[0] };
  salvar();
  document.getElementById('metaResult').innerHTML = '<div class="result"><h3>🎯 Meta definida!</h3><div class="info">Perder <strong>'+kgPerder.toFixed(1)+' kg</strong></div><div class="info">Ritmo: '+ritmo+' kg/semana</div><div class="info">Previsão: <strong>'+dataFinal.toLocaleDateString('pt-BR')+'</strong> ('+semanas+' semanas)</div></div>';
  atualizarDashboard();
}

function renderRefeicoes() {

  const refsHoje = dados.refeicoes.filter(r => r.data === hojeStr);

  document.getElementById('calConsumidas').textContent = totalCal;
  document.getElementById('calGastas').textContent = totalGasto;

  list.innerHTML = refsHoje.map((r) => {
    const i = dados.refeicoes.indexOf(r);
    return '<div class="list-item"><div class="info"><div class="title">'+r.tipo+'</div><div class="sub">'+r.desc+'</div></div><div style="display:flex; align-items:center; gap:8px;"><span class="badge">'+r.cal+' kcal</span><button class="btn btn-danger btn-small" onclick="delRef('+i+')">🗑️</button></div></div>';

}

  }).join('');

function atualizarDashboard() {
  const pesoAtual = dados.pesos.length > 0 ? dados.pesos[dados.pesos.length-1].valor : null;
  document.getElementById('statPeso').textContent = pesoAtual ? pesoAtual.toFixed(1) : '--';
  document.getElementById('statMeta').textContent = dados.meta ? dados.meta.desejado : '--';
  if (pesoAtual && dados.pesos.length > 1) {
    const perda = dados.pesos[0].valor - pesoAtual;
    document.getElementById('statPerda').textContent = perda.toFixed(1);
  } else {
    document.getElementById('statPerda').textContent = '--';
  }
  const defHoje = calcularDeficitDia(hoje());
  document.getElementById('statDeficit').textContent = defHoje.deficit;
  if (dados.meta && pesoAtual) {
    const totalPerder = dados.meta.atual - dados.meta.desejado;
    const jaPerdeu = dados.meta.atual - pesoAtual;
    const pct = Math.max(0, Math.min(100, (jaPerdeu / totalPerder) * 100));
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.textContent = pct.toFixed(0) + '%';
    document.getElementById('progressInfo').textContent = 'Você já perdeu '+jaPerdeu.toFixed(1)+' kg de '+totalPerder.toFixed(1)+' kg. '+(pct >= 100 ? '🎉 Meta atingida!' : 'Continue firme!');
  } else {
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressFill').textContent = '0%';
    document.getElementById('progressInfo').textContent = 'Defina sua meta na aba "Peso" para ver o progresso';
  }
  desenharGrafico();
}
function desenharGrafico() {
  const canvas = document.getElementById('chartPeso');
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = 150;
  ctx.clearRect(0, 0, w, h);
  if (dados.pesos.length < 2) {
    ctx.fillStyle = '#9ca3af';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Registre pelo menos 2 pesos para ver o gráfico', w/2, h/2);
    return;
  }
  const pesos = dados.pesos.slice(-15);
  const valores = pesos.map(p => p.valor);
  const min = Math.min(...valores) - 1;
  const max = Math.max(...valores) + 1;
  const padding = 30;
  const wUtil = w - padding * 2;
  const hUtil = h - padding * 2;
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding, padding);
  ctx.lineTo(padding, h - padding);
  ctx.lineTo(w - padding, h - padding);
  ctx.stroke();
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.beginPath();
  pesos.forEach((p, i) => {
    const x = padding + (i / (pesos.length - 1)) * wUtil;
    const y = h - padding - ((p.valor - min) / (max - min)) * hUtil;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#059669';
  pesos.forEach((p, i) => {
    const x = padding + (i / (pesos.length - 1)) * wUtil;
    const y = h - padding - ((p.valor - min) / (max - min)) * hUtil;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.fillStyle = '#6b7280';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(max.toFixed(1), padding - 5, padding + 4);
  ctx.fillText(min.toFixed(1), padding - 5, h - padding);
}
